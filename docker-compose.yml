services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8888:80"
      - "8443:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - nextjs

  nextjs:
    build:
      context: .
      args:
        NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL:?Set NEXT_PUBLIC_STRAPI_URL in .env}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL:?Set NEXT_PUBLIC_STRAPI_URL in .env}

volumes:
  caddy-data:
  caddy-config:
